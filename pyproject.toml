[project]
name = "simengine"
dynamic = ["version"]
description = "Discrete-event simulation with experiment rigour built in"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/simengine/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
